# Copy to application-local.yml; set SPRING_PROFILES_ACTIVE=local.
# Prepare the database tables and synthetic seed data separately.
server:
  address: 127.0.0.1
  port: ${SERVER_PORT:9090}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
